<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Te amo demasiado 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --morado:#5b2a86; --rosa:#ff4fa3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; font-family:'Quicksand','Comic Sans MS',sans-serif; color:var(--morado); }
  body { background:linear-gradient(170deg,#ffb3dc 0%,#d3a8ff 48%,#8fb8ff 100%); }
  canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
  .titulo { position:fixed; top:calc(env(safe-area-inset-top,0px) + 3.5vh); left:0; right:0; text-align:center; padding:0 20px; pointer-events:none; }
  .titulo h1 { font-family:'Pacifico','Comic Sans MS',cursive; font-weight:normal; font-size:clamp(1.7rem,7vw,2.8rem); color:#fff; text-shadow:0 3px 0 #ff4fa3, 0 0 18px rgba(255,255,255,.9); }
  .titulo p { margin-top:4px; font-size:clamp(.85rem,3.4vw,1.1rem); color:#fff; font-weight:600; text-shadow:0 1px 6px rgba(91,42,134,.55); }
  .abajo { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 3vh); display:flex; flex-direction:column; align-items:center; gap:12px; padding:0 18px; }
  .card { max-width:480px; background:rgba(255,255,255,.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border:2px solid rgba(255,255,255,.85); border-radius:26px; padding:16px 20px; text-align:center; font-size:clamp(.98rem,4vw,1.2rem); line-height:1.5; font-weight:600; box-shadow:0 8px 24px rgba(91,42,134,.25); opacity:0; transform:translateY(14px); transition:opacity 1.2s, transform 1.2s; pointer-events:none; }
  .card.show { opacity:1; transform:none; }
  button { background:#fff; color:var(--rosa); border:2px solid var(--rosa); border-radius:30px; padding:10px 24px; font:inherit; font-weight:600; font-size:1rem; cursor:pointer; box-shadow:0 4px 0 var(--rosa); }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--rosa); }
  .abajo { pointer-events:none; }
  .abajo button { pointer-events:auto; padding:10px 18px; }
  .botones { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .hint { font-size:.85rem; color:#fff; font-weight:600; text-shadow:0 1px 5px rgba(91,42,134,.6); }
</style>
</head>

const CELDAS = 11000;   // más = más parecido a la foto (baja a 7000 si tu celular va lento)
// ===============================

document.getElementById('card').textContent = MENSAJE;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR;
}
addEventListener('resize', resize); resize();

// ---- Estrellitas: color de la foto mezclado con rosa/morado ----
const STOPS = [[0,[91,42,134]],[.45,[255,79,163]],[.8,[255,179,218]],[1,[255,249,196]]];
function mezcla(t){
  for (let i = 1; i < STOPS.length; i++){
    if (t <= STOPS[i][0]){
      const [a, ca] = STOPS[i-1], [b, cb] = STOPS[i], k = (t - a) / (b - a);
      return ca.map((v, j) => v + (cb[j] - v) * k);
    }
  }
  return STOPS[STOPS.length-1][1];
}
const MEZCLA_FOTO = .75;   // 0 = todo rosa/morado, 1 = colores reales de la foto
const cache = new Map();
function sprite(r, g, b){
  const key = (r << 16) | (g << 8) | b;
  let s = cache.get(key);
  if (s) return s;
  s = document.createElement('canvas'); s.width = s.height = 40;
  const x = s.getContext('2d');
  const gr = x.createRadialGradient(20,20,1,20,20,20);
  gr.addColorStop(0, `rgba(${r},${g},${b},.5)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0,0,40,40);
  x.fillStyle = `rgb(${r},${g},${b})`;
  x.beginPath();
  x.moveTo(20,3); x.quadraticCurveTo(22,18,37,20); x.quadraticCurveTo(22,22,20,37);
  x.quadraticCurveTo(18,22,3,20); x.quadraticCurveTo(18,18,20,3); x.fill();
  x.fillStyle = 'rgba(255,255,255,.55)';
  x.beginPath(); x.arc(20,20,2,0,6.2832); x.fill();
  cache.set(key, s);
  return s;
}

// ---- Partículas desde la foto ----
let pts = [], aspect = .75, cols = 70, t0 = 0, scatterAt = -10;
// ---- Corazón visto de lado: silueta en el plano (z, y) ----
const HEART = (() => {
  const poly = [];
  for (let i = 0; i < 360; i++){
    const t = i / 360 * 6.2832;
    poly.push([16*Math.pow(Math.sin(t),3), 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)]);
  }
  let ymin = 1e9, ymax = -1e9;
  for (const p of poly){ ymin = Math.min(ymin, p[1]); ymax = Math.max(ymax, p[1]); }
  const sc = 1 / (ymax - ymin), yc = (ymax + ymin) / 2;
  return poly.map(p => [p[0] * sc, (p[1] - yc) * sc]);
})();
function zHeart(y){
  const xs = [];
  for (let i = 0; i < HEART.length; i++){
    const a = HEART[i], b = HEART[(i + 1) % HEART.length];
    if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) xs.push(a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
  }
  xs.sort((p, q) => p - q);
  const L = []; let tot = 0;
  for (let i = 0; i + 1 < xs.length; i += 2){ L.push([xs[i], xs[i+1]]); tot += xs[i+1] - xs[i]; }
  let r = Math.random() * tot;
  for (const iv of L){ const w = iv[1] - iv[0]; if (r <= w) return iv[0] + r; r -= w; }
  return 0;
}

function construir(img){
  aspect = img.width / img.height;
  cols = Math.round(Math.sqrt(CELDAS * aspect));
  const rows = Math.round(cols / aspect);
  const off = document.createElement('canvas'); off.width = cols; off.height = rows;
  const o = off.getContext('2d', { willReadFrequently:true });
  o.drawImage(img, 0, 0, cols, rows);
  const d = o.getImageData(0, 0, cols, rows).data;
  pts = [];
  const q = v => Math.max(0, Math.min(255, Math.round(v / 24) * 24));
  for (let j = 0; j < rows; j++){
    for (let i = 0; i < cols; i++){
      const k = (j*cols + i) * 4;
      const r = d[k], g = d[k+1], b = d[k+2];
      const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
      const duo = mezcla(Math.pow(lum, .8));
      const m = MEZCLA_FOTO;
      const cr = q(r*m + duo[0]*(1-m)), cg = q(g*m + duo[1]*(1-m)), cb = q(b*m + duo[2]*(1-m));
      const fx = i / cols, fy = j / rows, hy = -(fy - .5);
      const ang = Math.random() * 6.2832, rr = 1.4 + Math.random() * 2;
      pts.push({
        hx:(fx - .5) * aspect, hy:hy, hz:zHeart(hy),
        sx:Math.cos(ang) * rr, sy:Math.sin(ang) * rr, sz:(Math.random() - .5) * 3,
        sp: sprite(cr, cg, cb),
        k: .9 + Math.random() * .25,
        tw: Math.random() * 6.2832, tv: 1.5 + Math.random() * 2.5,
        delay: Math.random() * 1.3
      });
    }
  }
  t0 = performance.now() / 1000;
  setTimeout(() => document.getElementById('card').classList.add('show'), 2600);
}
const img = new Image();
img.onload = () => construir(img);
img.src = FOTO;

const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
const TAU = 6.2832, HP = 1.5708;
let drag = false, lastX = 0, boost = 0, ang = 0, goal = 0, mode = 'foto', last = 0;
const btnGiro = document.getElementById('btnGiro');
function actualizarBoton(){ btnGiro.textContent = mode === 'corazon' ? 'Ver la foto 📸' : 'Ver el corazón 💗'; }
cv.addEventListener('pointerdown', e => { drag = true; mode = 'libre'; lastX = e.clientX; goal = ang; actualizarBoton(); });
addEventListener('pointerup', () => { if (drag){ drag = false; last = performance.now() / 1000; } });
addEventListener('pointermove', e => { if (drag){ ang += (e.clientX - lastX) * .008; goal = ang; lastX = e.clientX; } });

function draw(now){
  const t = now / 1000;
  ctx.clearRect(0, 0, W, H);

  if (!drag){
    if (mode === 'libre' && t - last > 5){ mode = 'foto'; goal = Math.round(ang / TAU) * TAU; }
    ang += (goal - ang) * .07;
  }
  const amp = 0;   // sin balanceo: la foto se queda quieta
  const sway = ang + Math.sin(t * .6) * amp;
  boost *= .94;
  const size = Math.min(H * .46, W * .9 / aspect) * (1 + boost);
  const cx = W/2, cy = H * .42;
  const ca = Math.cos(sway), sa = Math.sin(sway);
  const base = (size * aspect / cols) * 2.3;              // tamaño de cada estrellita
  for (const p of pts){
    let f = ease((t - t0 - p.delay) / 2.4);
    const sc = t - scatterAt;
    if (sc >= 0 && sc < 2.4){
      const w = sc < .5 ? ease(sc / .5) : 1 - ease((sc - .5) / 1.9);
      f *= (1 - w);
    }
    const x = p.sx + (p.hx - p.sx) * f, y = p.sy + (p.hy - p.sy) * f, z = p.sz + (p.hz - p.sz) * f;
    const rx = x*ca + z*sa, rz = -x*sa + z*ca;
    const pf = 9 / (9 + rz);
    const tw = .5 + .5 * Math.sin(t * p.tv + p.tw);
    const s = base * p.k * pf * (.92 + .16 * tw);
    ctx.globalAlpha = .78 + .22 * tw;
    ctx.drawImage(p.sp, cx + rx*size*pf - s/2, cy - y*size*pf - s/2, s, s);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

document.getElementById('btn').addEventListener('click', () => {
  scatterAt = performance.now() / 1000; boost = .05;
});
btnGiro.addEventListener('click', () => {
  if (mode === 'corazon'){ mode = 'foto'; goal = Math.round(ang / TAU) * TAU; }
  else { mode = 'corazon'; goal = Math.round((ang - HP) / Math.PI) * Math.PI + HP; }
  actualizarBoton();
});
</script>
