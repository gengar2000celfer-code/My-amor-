<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti, Yamileth 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #f7c8d9;
    --pink-dark: #e89ab5;
    --cream: #fdf6ee;
    --cork: #d7b98e;
    --washi1: #f4a6a6;
    --washi2: #a6c8f4;
    --washi3: #c8f4a6;
    --ink: #5a4a42;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(160deg, var(--cork) 0%, #c9a876 100%);
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 12px 12px, cover;
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 14px 60px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
