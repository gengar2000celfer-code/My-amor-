<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — cargar contenido</title>
<style>
  body {
    font-family: sans-serif;
    background: #fdf6ee;
    color: #5a4a42;
    padding: 20px 16px 60px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 1.3em; text-align: center; }
  section {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 24px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }
  h2 { font-size: 1.1em; margin-top: 0; color: #b5527e; }
  textarea, input[type="date"] {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 0.95em;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  textarea { min-height: 140px; resize: vertical; }
  button {
    background: #e89ab5;
    color: #fff;
    border: none;
    padding: 12px 18px;
    border-radius: 24px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
  }
  .hint { font-size: 0.8em; color: #999; margin-bottom: 10px; }
  .log {
    margin-top: 10px;
    font-size: 0.8em;
    background: #f6f0e8;
    padding: 10px;
    border-radius: 6px;
    white-space: pre-wrap;
    max-height: 160px;
    overflow-y: auto;
  }
</style>
</head>
<body>
<h1>Cargar contenido a Firestore</h1>

<section>
  <h2>Razones</h2>
  <p class="hint">Cada caja es una razón completa (puede tener varios renglones). Toca + para agregar otra caja.</p>
  <div id="razones-lista"></div>
  <button id="btn-add-razon" style="background:#c8b8a8; margin-bottom:14px;">+ agregar otra caja</button>
  <button id="btn-razones">Subir todas las razones</button>
  <div class="log" id="log-razones"></div>
</section>

<section>
  <h2>Carta / cápsula del tiempo</h2>
  <p class="hint">Fecha en la que se puede abrir esta carta.</p>
  <input type="date" id="capsula-fecha">
  <textarea id="capsula-mensaje" placeholder="Escribe aquí la carta completa..."></textarea>
  <button id="btn-capsula">Agregar esta carta</button>
  <div class="log" id="log-capsula"></div>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC05JhJVgyR9YsH-ciMDEy-XohRuw_ehSQ",
    authDomain: "my-love-b3e12.firebaseapp.com",
    projectId: "my-love-b3e12",
    storageBucket: "my-love-b3e12.firebasestorage.app",
    messagingSenderId: "587338174796",
    appId: "1:587338174796:web:bd64ffc9945c733f3b7fe9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  function agregarCajaRazon() {
    const lista = document.getElementById("razones-lista");
    const wrap = document.createElement("div");
    wrap.style.position = "relative";
    wrap.style.marginBottom = "6px";

    const ta = document.createElement("textarea");
    ta.className = "razon-caja";
    ta.placeholder = "Escribe aquí una razón completa...";
    ta.style.minHeight = "90px";

    const del = document.createElement("button");
    del.textContent = "quitar esta caja";
    del.style.background = "#eee";
    del.style.color = "#a33";
    del.style.fontSize = "0.8em";
    del.style.padding = "6px 10px";
    del.style.marginBottom = "12px";
    del.addEventListener("click", () => wrap.remove());

    wrap.appendChild(ta);
    wrap.appendChild(del);
    lista.appendChild(wrap);
  }

  document.getElementById("btn-add-razon").addEventListener("click", agregarCajaRazon);
  agregarCajaRazon(); // arranca con una caja lista

  document.getElementById("btn-razones").addEventListener("click", async () => {
    const cajas = Array.from(document.querySelectorAll(".razon-caja"))
      .map(t => t.value.trim())
      .filter(t => t.length > 0);
    const log = document.getElementById("log-razones");

    if (cajas.length === 0) {
      log.textContent = "Escribe al menos una razón primero.";
      return;
    }

    log.textContent = `Subiendo ${cajas.length} razón(es)...\n`;
    let ok = 0;
    for (const texto of cajas) {
      try {
        await addDoc(collection(db, "razones"), { texto });
        ok++;
        log.textContent += `✔ subida (${ok}/${cajas.length})\n`;
      } catch (err) {
        log.textContent += `✖ error: ${err.message}\n`;
      }
    }
    log.textContent += "\nListo.";
    document.getElementById("razones-lista").innerHTML = "";
    agregarCajaRazon();
  });

  document.getElementById("btn-capsula").addEventListener("click", async () => {
    const fecha = document.getElementById("capsula-fecha").value;
    const mensaje = document.getElementById("capsula-mensaje").value.trim();
    const log = document.getElementById("log-capsula");

    if (!fecha) {
      log.textContent = "Elige una fecha primero.";
      return;
    }
    if (!mensaje) {
      log.textContent = "Escribe el mensaje de la carta primero.";
      return;
    }

    log.textContent = "Subiendo carta...";
    try {
      await addDoc(collection(db, "capsulas"), { fecha, mensaje });
      log.textContent = `✔ Carta para ${fecha} subida correctamente.`;
      document.getElementById("capsula-mensaje").value = "";
      document.getElementById("capsula-fecha").value = "";
    } catch (err) {
      log.textContent = `✖ error: ${err.message}`;
    }
  });
</script>
</body>
</html>
