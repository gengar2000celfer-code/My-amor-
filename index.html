<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para que sepas cuanto te amo bb</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap');

  :root{
    --paper: #FBF3E6;
    --paper-dark: #F1E4D0;
    --ink: #4A382E;
    --rose: #D9637A;
    --rose-deep: #B84A61;
    --gold: #EEB84E;
    --cork: #C8A27A;
    --tape: #F4DCC7;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(216,164,120,0.15), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(216,164,120,0.12), transparent 45%),
      var(--paper);
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
    overflow-x: hidden;
  }

  .stage{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 20px;
  }

  .card{
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--paper-dark);
    border-radius: 6px;
    padding: 44px 28px 36px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 18px 30px -18px rgba(74,56,46,0.35);
    text-align: center;
  }

  .tape{
    position:absolute;
    width: 86px;
    height: 30px;
    background: var(--tape);
    opacity: 0.85;
    box-shadow: 0 2px 4px rgba(74,56,46,0.15);
  }
  .tape.tl{ top:-14px; left:-18px; transform: rotate(-10deg); }
  .tape.tr{ top:-14px; right:-18px; transform: rotate(9deg); }

  .eyebrow-note{
    font-family:'Caveat', cursive;
    font-size: 1.35rem;
    color: var(--rose-deep);
    margin: 0 0 6px;
  }

  h1{
    font-family:'Caveat', cursive;
    font-size: 2.5rem;
    line-height: 1.15;
    margin: 0 0 22px;
    color: var(--ink);
  }

  .counter-wrap{
    margin: 6px 0 18px;
  }

  .counter{
    font-family:'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 3.4rem;
    color: var(--rose-deep);
    line-height: 1;
    transition: transform 0.15s ease;
  }

  .counter.infinite{
    font-size: 4.2rem;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(238,184,78,0.5);
  }

  .counter-label{
    font-size: 0.95rem;
    color: var(--ink);
    opacity: 0.75;
    margin-top: 4px;
    min-height: 1.4em;
  }

  .heart-btn{
    appearance: none;
    border: none;
    background: none;
    cursor: pointer;
    width: 120px;
    height: 120px;
    margin: 6px auto 18px;
    display: block;
    padding: 0;
    transition: transform 0.08s ease;
  }
  .heart-btn:active{ transform: scale(0.9); }
  .heart-btn svg{ width: 100%; height: 100%; }
  .heart-btn:focus-visible{ outline: 3px solid var(--rose); outline-offset: 4px; border-radius: 50%; }

  .heart-path{
    fill: var(--rose);
    transition: fill 0.4s ease;
  }
  .heart-btn.gold .heart-path{ fill: var(--gold); }

  .hint{
    font-size: 0.85rem;
    color: var(--ink);
    opacity: 0.55;
    margin-top: -8px;
  }

  .reveal{
    margin-top: 22px;
    font-family:'Caveat', cursive;
    font-size: 1.7rem;
    line-height: 1.35;
    color: var(--rose-deep);
    min-height: 1.4em;
  }

  .final-msg{
    display:none;
    margin-top: 8px;
  }
  .final-msg.show{ display:block; animation: fade-in 0.9s ease forwards; }

  .final-msg p{
    font-family:'Caveat', cursive;
    font-size: 1.9rem;
    line-height: 1.3;
    margin: 4px 0;
    color: var(--ink);
  }
  .final-msg .signature{
    margin-top: 14px;
    font-size: 1.4rem;
    color: var(--rose-deep);
  }

  @keyframes fade-in{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .floating-heart{
    position: fixed;
    pointer-events: none;
    font-size: 1.4rem;
    color: var(--rose);
    animation: float-up 1.3s ease-out forwards;
    z-index: 5;
  }
  @keyframes float-up{
    0%{ opacity: 0.9; transform: translateY(0) scale(0.8) rotate(0deg); }
    100%{ opacity: 0; transform: translateY(-140px) scale(1.1) rotate(20deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .heart-btn, .floating-heart, .final-msg.show{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card">
    <div class="tape tl"></div>
    <div class="tape tr"></div>

    <p class="eyebrow-note">Mi mujer hermosa ❤️❤️</p>
    <h1>¿Cuánto te amo?</h1>

    <div class="counter-wrap">
      <div class="counter" id="counter">0</div>
      <div class="counter-label" id="counterLabel">toca el corazón y descúbrelo</div>
    </div>

    <button class="heart-btn" id="heartBtn" aria-label="Presiona el corazón">
      <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
        <path class="heart-path" d="M50 88 C 20 65, 2 45, 2 26 C 2 10, 15 0, 30 0 C 40 0, 47 6, 50 12 C 53 6, 60 0, 70 0 C 85 0, 98 10, 98 26 C 98 45, 80 65, 50 88 Z"/>
      </svg>
    </button>

    <p class="hint" id="hint">sigue tocando…</p>

    <div class="reveal" id="reveal"></div>

    <div class="final-msg" id="finalMsg">
      <p>Porque no importa cuánto cuente,</p>
      <p>nunca voy a llegar al final.</p>
      <p class="signature">mi amor por ti es infinito 🩷</p>
    </div>
  </div>
</div>

<script>
  const counterEl = document.getElementById('counter');
  const counterLabel = document.getElementById('counterLabel');
  const heartBtn = document.getElementById('heartBtn');
  const hint = document.getElementById('hint');
  const reveal = document.getElementById('reveal');
  const finalMsg = document.getElementById('finalMsg');

  let count = 0;
  let finished = false;

  const milestones = [
    { at: 8,  text: "más… y más…" },
    { at: 18, text: "sigo sin poder parar de contar" },
    { at: 30, text: "y ya perdí la cuenta hace rato" },
    { at: 42, text: "esto ya no tiene número exacto" },
  ];

  const THRESHOLD = 55;

  function spawnFloatingHeart(x, y){
    const h = document.createElement('div');
    h.className = 'floating-heart';
    h.textContent = '🩷';
    h.style.left = x + 'px';
    h.style.top = y + 'px';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1300);
  }

  function pulseButton(){
    heartBtn.style.transform = 'scale(1.12)';
    setTimeout(() => { heartBtn.style.transform = 'scale(1)'; }, 90);
  }

  function finish(){
    finished = true;
    counterEl.textContent = '∞';
    counterEl.classList.add('infinite');
    counterLabel.textContent = 'así de simple';
    heartBtn.classList.add('gold');
    hint.style.display = 'none';
    reveal.textContent = '';
    finalMsg.classList.add('show');

    for (let i = 0; i < 14; i++){
      setTimeout(() => {
        const x = Math.random() * window.innerWidth;
        const y = window.innerHeight * 0.6 + Math.random() * 80;
        spawnFloatingHeart(x, y);
      }, i * 90);
    }
  }

  heartBtn.addEventListener('click', (e) => {
    if (finished){
      const rect = heartBtn.getBoundingClientRect();
      spawnFloatingHeart(rect.left + rect.width/2, rect.top);
      return;
    }

    count++;
    counterEl.textContent = count;
    pulseButton();

    const rect = heartBtn.getBoundingClientRect();
    spawnFloatingHeart(
      rect.left + rect.width/2 + (Math.random()*40 - 20),
      rect.top + rect.height/2
    );

    const m = milestones.find(m => m.at === count);
    if (m){
      reveal.textContent = m.text;
    }

    if (count === 1){
      counterLabel.textContent = 'vez que pienso en ti hoy';
    } else if (count < THRESHOLD){
      counterLabel.textContent = 'veces que pienso en ti hoy';
    }

    if (count >= THRESHOLD){
      finish();
    }
  });
</script>

</body>
</html>
