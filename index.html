<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Yamileth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    /* Atardecer (modo claro) */
    --bg-top: #ffe9df;
    --bg-bottom: #f4c3d4;
    --ink: #4a1d3a;
    --ink-soft: #6f3b59;
    --star: #b83a72;
    --line: #d1648d;
    --glow: rgba(184, 58, 114, 0.4);
    --heartfill: rgba(209, 100, 141, 0.16);
    --dust: #b83a72;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #0c0e2c;
      --bg-bottom: #2b1242;
      --ink: #fbeef2;
      --ink-soft: #c9b3d6;
      --star: #ffd9a0;
      --line: #f4a9c0;
      --glow: rgba(255, 190, 150, 0.55);
      --heartfill: rgba(244, 169, 192, 0.14);
      --dust: #fff1d6;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #0c0e2c;
    --bg-bottom: #2b1242;
    --ink: #fbeef2;
    --ink-soft: #c9b3d6;
    --star: #ffd9a0;
    --line: #f4a9c0;
    --glow: rgba(255, 190, 150, 0.55);
    --heartfill: rgba(244, 169, 192, 0.14);
    --dust: #fff1d6;
  }

  html {
    height: 100%;
    scroll-padding-top: env(safe-area-inset-top, 0px);
    background: var(--bg-bottom);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 300;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .stage {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.6rem;
    padding: 1.5rem;
  }

  .heart {
    width: min(74vw, 320px, 40vh);
    height: auto;
    overflow: visible;
    transform-origin: 50% 55%;
  }
  .heart .fill {
    fill: var(--heartfill);
    opacity: 0;
    transition: opacity 1.4s ease;
  }
  .heart .seg {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    transition: stroke-dashoffset 1.1s ease;
  }
  .heart .seg.on { stroke-dashoffset: 0; }
  .heart .star {
    fill: var(--star);
    opacity: 0.35;
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0.55);
    transition: opacity 0.7s ease, transform 0.7s ease, filter 0.7s ease;
  }
  .heart .star.lit {
    opacity: 1;
    transform: scale(1);
    filter: drop-shadow(0 0 5px var(--glow));
  }
  .heart.done .fill { opacity: 1; }
  .heart.done { animation: beat 2.6s ease-in-out infinite; }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.045); }
    24% { transform: scale(1); }
    36% { transform: scale(1.03); }
    48% { transform: scale(1); }
  }

  .msg {
    width: min(88vw, 30rem);
    min-height: 8.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .msg p {
    margin: 0;
    font-size: clamp(1.55rem, 6.4vw, 2.3rem);
    line-height: 1.35;
    text-wrap: balance;
    opacity: 0;
    transition: opacity 0.7s ease;
  }
  .msg p.on { opacity: 1; }
  .msg p.final {
    font-size: clamp(3.2rem, 17vw, 5.2rem);
    font-weight: 600;
    line-height: 1.1;
    text-shadow: 0 0 32px var(--glow);
  }

  .foot {
    min-height: 4.2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    color: var(--ink-soft);
    font-size: 1.05rem;
  }
  .hint { transition: opacity 0.6s ease; animation: breathe 3s ease-in-out infinite; }
  .hint.off { opacity: 0; animation: none; }
  @keyframes breathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  .from { opacity: 0; transition: opacity 1s ease 0.6s; font-size: 1.25rem; }
  .from.on { opacity: 1; }

  .again {
    display: none;
    font: inherit;
    font-size: 1rem;
    color: var(--ink-soft);
    background: none;
    border: 0;
    border-bottom: 1px solid currentColor;
    padding: 0.25rem 0.1rem;
    cursor: pointer;
  }
  .again.on { display: inline-block; }
  .again:focus-visible { outline: 2px solid var(--line); outline-offset: 4px; }

  .float {
    position: fixed;
    z-index: 3;
    pointer-events: none;
    color: var(--line);
    text-shadow: 0 0 14px var(--glow);
    font-style: normal;
    animation: rise 2.2s ease-out forwards;
  }
  @keyframes rise {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), -170px) scale(1.25); }
  }

  @media (prefers-reduced-motion: reduce) {
    .heart.done, .hint { animation: none; }
    .heart .seg, .heart .star, .msg p, .heart .fill { transition-duration: 0.01s; }
    .float { animation-duration: 0.8s; }
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<main class="stage">
  <svg class="heart" id="heart" viewBox="0 0 200 190" aria-hidden="true"></svg>
  <div class="msg" aria-live="polite"><p id="text"></p></div>
  <div class="foot">
    <span class="hint" id="hint">Toca la pantalla</span>
    <span class="from" id="from"></span>
    <button class="again" id="again" type="button">Volver a empezar</button>
  </div>
</main>

<script>
  /* ====== Aquí puedes cambiar los textos ====== */
  var INTRO = "Amorcito hermosa,";
  var MESSAGES = [
    "perdóname por haberte decepcionado.",
    "Yo, que quería cuidarte",
    "como se cuida una llama en medio del viento,",
    "te fallé, y hoy ese dolor me pesa en el pecho.",
    "Cada segundo que pasa sin ti",
    "se siente como si fueran años.",
    "Te necesito como el mar necesita la luna:",
    "para saber hacia dónde volver.",
    "Quiero hablar contigo, cuando tú quieras,",
    "porque mi corazón ya escogió dónde quedarse.",
    "Te amo."          /* el último texto se muestra grande */
  ];
  var FROM = "— Fermín";
  /* ============================================ */

  var M = MESSAGES.length;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Cielo con estrellas ---------- */
  var cvs = document.getElementById("sky");
  var ctx = cvs.getContext("2d");
  var W = 0, H = 0, stars = [], dust = "#fff";
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function readDust() {
    dust = getComputedStyle(document.documentElement).getPropertyValue("--dust").trim() || "#fff";
  }
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = W * dpr; cvs.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round((W * H) / 9000);
    stars = [];
    for (var i = 0; i < n; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H,
                   r: Math.random() * 1.3 + 0.3, p: Math.random() * 6.28, s: Math.random() * 0.9 + 0.3 });
    }
    readDust();
    if (reduce) drawSky(0);
  }
  function drawSky(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = dust;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = 0.22 + 0.6 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.s + s.p));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function loop(t) { drawSky(t); requestAnimationFrame(loop); }
  window.addEventListener("resize", resize);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
    setTimeout(function () { readDust(); if (reduce) drawSky(0); }, 50);
  });
  resize();
  if (!reduce) requestAnimationFrame(loop);

  /* ---------- Corazón de estrellas ---------- */
  var NS = "http://www.w3.org/2000/svg";
  var heart = document.getElementById("heart");
  function hx(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function hy(t) { return 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t); }
  function px(t) { return 100 + 5.2 * hx(t); }
  function py(t) { return 78 - 5.2 * hy(t); }
  function tAt(i) { return Math.PI + (2 * Math.PI * i) / M; }
  function pathBetween(a, b, steps) {
    var d = "";
    for (var k = 0; k <= steps; k++) {
      var t = a + ((b - a) * k) / steps;
      d += (k === 0 ? "M" : "L") + px(t).toFixed(2) + " " + py(t).toFixed(2) + " ";
    }
    return d;
  }
  function el(name, attrs) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  var fillPath = el("path", { "class": "fill", d: pathBetween(Math.PI, 3 * Math.PI, 120) + "Z" });
  heart.appendChild(fillPath);
  var segs = [], dots = [];
  for (var i = 0; i < M; i++) {
    var s = el("path", { "class": "seg", pathLength: "1", d: pathBetween(tAt(i), tAt(i + 1), 24) });
    heart.appendChild(s); segs.push(s);
  }
  for (var j = 0; j < M; j++) {
    var c = el("circle", { "class": "star", cx: px(tAt(j)).toFixed(2), cy: py(tAt(j)).toFixed(2), r: "4" });
    heart.appendChild(c); dots.push(c);
  }

  /* ---------- Historia ---------- */
  var text = document.getElementById("text");
  var hint = document.getElementById("hint");
  var from = document.getElementById("from");
  var again = document.getElementById("again");
  var step = 0, swap = null;

  function showMsg(str, final) {
    clearTimeout(swap);
    text.classList.remove("on");
    swap = setTimeout(function () {
      text.textContent = str;
      text.classList.toggle("final", !!final);
      text.classList.add("on");
    }, reduce ? 0 : 380);
  }

  function reset() {
    step = 0;
    segs.forEach(function (s) { s.classList.remove("on"); });
    dots.forEach(function (d, i) { d.classList.toggle("lit", i === 0); });
    heart.classList.remove("done");
    hint.classList.remove("off");
    hint.textContent = "Toca la pantalla";
    from.classList.remove("on");
    again.classList.remove("on");
    showMsg(INTRO, false);
  }

  function advance() {
    if (step >= M) return;
    step++;
    var last = step === M;
    showMsg(MESSAGES[step - 1], last);
    segs[step - 1].classList.add("on");
    dots[step % M].classList.add("lit");
    if (step >= 2) hint.classList.add("off");
    if (last) {
      setTimeout(function () { heart.classList.add("done"); }, reduce ? 0 : 900);
      from.textContent = FROM;
      from.classList.add("on");
      again.classList.add("on");
    }
  }

  function burst(x, y) {
    var n = document.querySelectorAll(".float").length;
    if (n > 24) return;
    var h = document.createElement("span");
    h.className = "float";
    h.textContent = "♥";
    h.style.left = x + "px";
    h.style.top = y + "px";
    h.style.fontSize = 16 + Math.random() * 22 + "px";
    h.style.setProperty("--dx", (Math.random() * 90 - 45).toFixed(0) + "px");
    h.addEventListener("animationend", function () { h.remove(); });
    document.body.appendChild(h);
  }

  document.addEventListener("pointerdown", function (e) {
    if (e.target.closest("button")) return;
    if (step >= M) burst(e.clientX, e.clientY); else advance();
  });
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && !e.target.closest("button")) {
      e.preventDefault();
      if (step >= M) burst(W / 2, H / 2); else advance();
    }
  });
  again.addEventListener("click", function () { reset(); });

  reset();
</script>
</body>
</html>
